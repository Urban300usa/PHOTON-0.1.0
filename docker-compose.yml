version: '3.8'

services:
  photon:
    build: .
    container_name: photon
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://photon:${POSTGRES_PASSWORD}@db:5432/photon
      # ESI OAuth credentials (set in .env file)
      - ESI_CLIENT_ID=${ESI_CLIENT_ID}
      - ESI_SECRET_KEY=${ESI_SECRET_KEY}
      # Session secret (generate a random string)
      - SESSION_SECRET=${SESSION_SECRET}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - photon-net
      - traefik  # Your existing traefik network
    labels:
      # Traefik labels - adjust domain as needed
      - "traefik.enable=true"
      - "traefik.http.routers.photon.rule=Host(`photon.intrepidcrossing.gg`)"
      - "traefik.http.routers.photon.entrypoints=websecure"
      - "traefik.http.routers.photon.tls.certresolver=letsencrypt"
      - "traefik.http.services.photon.loadbalancer.server.port=5000"

  db:
    image: postgres:15-bookworm
    container_name: photon-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=photon
      - POSTGRES_USER=photon
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U photon -d photon"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - photon-net
    # Uncomment to expose postgres for external access/debugging
    # ports:
    #   - "5432:5432"

volumes:
  postgres_data:

networks:
  photon-net:
    driver: bridge
  traefik:
    external: true  # Assumes you have an existing traefik network
